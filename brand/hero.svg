<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
  <title>جاده بیابانی هنگام غروب با شاسی‌بلند</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181b"/>
      <stop offset=".45" stop-color="#3b2a17"/>
      <stop offset=".72" stop-color="#b4741f"/>
      <stop offset=".8" stop-color="#e8a83a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".55" stop-color="#f4c55a"/>
      <stop offset="1" stop-color="#e09a26"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d0f"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="560" cy="440" r="330" fill="url(#glow)"/>
  <circle cx="560" cy="440" r="135" fill="url(#sun)"/>

  <!-- dunes -->
  <path d="M0 430 C180 395 330 400 470 425 S760 450 900 420 S1240 385 1400 410 S1560 428 1600 420 V600 H0Z" fill="#6a4417" opacity=".85"/>
  <path d="M0 455 C220 435 420 445 640 462 S1050 470 1250 448 S1520 440 1600 450 V600 H0Z" fill="#3a2711"/>

  <!-- road -->
  <rect y="470" width="1600" height="130" fill="url(#ground)"/>
  <rect y="472" width="1600" height="3" fill="#c99434" opacity=".55"/>
  <path d="M0 528 H1600" stroke="#d9ae43" stroke-width="4" stroke-dasharray="60 46" opacity=".75"/>
  <rect y="584" width="1600" height="3" fill="#c99434" opacity=".4"/>

  <!-- SUV silhouette, side view facing left -->
  <ellipse cx="500" cy="560" rx="300" ry="12" fill="#000" opacity=".55"/>
  <path d="M225 505 L222 458 Q224 438 236 432 L430 418 L490 350 L762 346 Q776 348 779 362 L783 498 Q782 510 770 512 L735 512 A55 55 0 0 0 625 512 L380 512 A55 55 0 0 0 270 512 L238 512 Q226 511 225 505Z" fill="#0b0a09"/>
  <path d="M444 416 L496 360 L746 358 L749 414Z" fill="#2e2415"/>
  <path d="M560 359 V415 M660 358 V414" stroke="#0b0a09" stroke-width="9"/>
  <path d="M236 432 L430 418 L490 350 L762 346 Q776 348 779 362" fill="none" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>
  <rect x="520" y="337" width="226" height="6" rx="3" fill="#0b0a09"/>
  <path d="M232 448 H262" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <path d="M770 380 V420" stroke="#d2462f" stroke-width="5" stroke-linecap="round"/>
  <g>
    <circle cx="325" cy="512" r="44" fill="#080706"/>
    <circle cx="325" cy="512" r="25" fill="none" stroke="#9e7414" stroke-width="4"/>
    <circle cx="325" cy="512" r="6" fill="#9e7414"/>
    <circle cx="680" cy="512" r="44" fill="#080706"/>
    <circle cx="680" cy="512" r="25" fill="none" stroke="#9e7414" stroke-width="4"/>
    <circle cx="680" cy="512" r="6" fill="#9e7414"/>
  </g>
</svg>
